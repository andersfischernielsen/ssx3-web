[package]
name = "ssx3-web"
description = "SSX 3 in the browser: the game compiled to WebAssembly (guest threads on JSPI stacks), drawn with WebGPU from a Web Worker (README.md)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

# Everything is for wasm32 only: natively this is an empty library.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ssx3-engine = { path = "../../ssx3/crates/ssx3-engine", default-features = false, features = ["ee-threads"] }
# wgpu's types are Send + Sync in a single-threaded wasm build with this.
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "File", "FileReaderSync", "OffscreenCanvas", "console"] }
console_error_panic_hook = "0.1"
foldhash = { version = "0.2", default-features = false }
talc = "5.1.1"
