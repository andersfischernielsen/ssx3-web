[workspace]
resolver = "2"
members = ["crates/web", "crates/vuworker"]
# ssx3-decomp (the game as a library): its crates are path dependencies and
# resolve their workspace settings from its own manifest.
exclude = ["ssx3"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Cargo takes profiles from the root workspace only: ssx3-decomp's.
[profile.release]
opt-level = 3
lto = "thin"

# Fast-to-build optimized profile for the (very large) generated game code.
[profile.game]
inherits = "release"
lto = false
codegen-units = 64
incremental = true

# The browser build (build.sh).
[profile.web]
inherits = "game"
